name: T00ls 签到

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0:00 (北京时间 8:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 上游 (dingpotian/t00ls-sign) 重写过历史,与本仓库没有共同祖先,
  # git merge 会直接报 "refusing to merge unrelated histories",故改为按文件同步。
  # README 的"已稳定运行"一行由上游维护,本地不再生成。
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/dingpotian/t00ls-sign.git
          git fetch upstream main

      - name: Sync README from upstream
        run: |
          git checkout upstream/main -- README.md
          if git diff --cached --quiet; then
            echo "README 与上游一致,无需提交"
          else
            git commit -m "chore: sync README from upstream [skip ci]"
            git push origin main
          fi

  checkin:
    needs: sync-upstream
    # 同步失败不应拖累签到
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run checkin
        env:
          T00LS_USERNAME: ${{ secrets.T00LS_USERNAME }}
          T00LS_PASSWORD: ${{ secrets.T00LS_PASSWORD }}
          T00LS_QUESTIONID: ${{ secrets.T00LS_QUESTIONID }}
          T00LS_ANSWER: ${{ secrets.T00LS_ANSWER }}
          DD_ACCESS_TOKEN: ${{ secrets.DD_ACCESS_TOKEN }}
          DD_SECRET: ${{ secrets.DD_SECRET }}
          WECOM_WEBHOOK_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
        run: python toolsqiandao.py

  # 兜底:同步或签到任一失败都通知
  notify:
    needs: [sync-upstream, checkin]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook notification
        run: |
          WEBHOOK="${{ secrets.WECOM_WEBHOOK_KEY }}"
          if [ -z "$WEBHOOK" ]; then
            echo "未配置 WECOM_WEBHOOK_KEY,跳过通知"
            exit 0
          fi
          # secret 存 key 时自动拼接完整地址,存完整 URL 时直接使用
          case "$WEBHOOK" in
            http*) URL="$WEBHOOK" ;;
            *)     URL="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=$WEBHOOK" ;;
          esac
          curl -sS -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"msgtype\": \"text\",
              \"text\": { \"content\": \"⚠️ T00ls 任务失败\n仓库: ${{ github.repository }}\n请查看 Actions 日志: https://github.com/${{ github.repository }}/actions\" }
            }"
