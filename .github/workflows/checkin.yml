name: T00ls 签到

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0:00 (北京时间 8:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run checkin
        env:
          T00LS_USERNAME: ${{ secrets.T00LS_USERNAME }}
          T00LS_PASSWORD: ${{ secrets.T00LS_PASSWORD }}
          T00LS_QUESTIONID: ${{ secrets.T00LS_QUESTIONID }}
          T00LS_ANSWER: ${{ secrets.T00LS_ANSWER }}
          DD_ACCESS_TOKEN: ${{ secrets.DD_ACCESS_TOKEN }}
          DD_SECRET: ${{ secrets.DD_SECRET }}
          WECOM_WEBHOOK_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
        run: python toolsqiandao.py

      - name: Update README run time
        run: python update_readme.py

      - name: Commit README if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: update run time [skip ci]"
            git push origin main
          else
            echo "README 无变化,跳过提交"
          fi

  # 兜底:签到失败时通知
  notify:
    needs: checkin
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook notification
        run: |
          WEBHOOK="${{ secrets.WECOM_WEBHOOK_KEY }}"
          if [ -z "$WEBHOOK" ]; then
            echo "未配置 WECOM_WEBHOOK_KEY,跳过通知"
            exit 0
          fi
          # secret 存 key 时自动拼接完整地址,存完整 URL 时直接使用
          case "$WEBHOOK" in
            http*) URL="$WEBHOOK" ;;
            *)     URL="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=$WEBHOOK" ;;
          esac
          curl -sS -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"msgtype\": \"text\",
              \"text\": { \"content\": \"⚠️ T00ls 签到失败\n仓库: ${{ github.repository }}\n请查看 Actions 日志: https://github.com/${{ github.repository }}/actions\" }
            }"
